<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活语文练习台</title>
<style>
:root{
  --bg:#F7F3E8; --card:#FFFDF7; --line:#E6DCC6; --line2:#D8CCB0;
  --ink:#1B242C; --ink2:#4A5A66; --ink3:#8A8578;
  --green:#2F6B4F; --green-bg:#E4F1E8; --green-line:#9CC7AC;
  --blue:#185FA5; --blue-bg:#E4EFFA; --blue-line:#9CC2E4;
  --red:#C0392B; --red-bg:#FBE9E6; --red-line:#E5A79C;
  --amber:#8A6A18; --amber-bg:#FCF2D8; --amber-line:#E2C97E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;height:auto}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
[hidden]{display:none !important}
.screen{max-width:1080px;margin:0 auto;padding:18px 20px 26px}

/* ---------- 选人页 ---------- */
.pick-top{display:flex;align-items:center;gap:12px;padding:6px 2px 2px}
.pick-top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.03em;flex:1}
.ghost-btn{border:1.5px solid var(--line2);background:var(--card);border-radius:12px;
  padding:10px 16px;font-size:15px;font-weight:700;color:var(--ink2);min-height:44px}
.ghost-btn:active{background:#F0EADC}
.pick-hint{margin:14px 2px 16px;font-size:17px;color:var(--ink2)}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.stu-card{background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .08s ease,border-color .15s ease;min-height:170px;justify-content:center}
.stu-card:active{transform:scale(.97)}
.stu-card:hover{border-color:var(--blue-line)}
.stu-card.paused{opacity:.5}
.stu-av{width:92px;height:92px;border-radius:50%;overflow:hidden;background:var(--blue-bg);
  display:flex;align-items:center;justify-content:center;flex:none;
  font-size:40px;font-weight:800;color:var(--blue);border:2px solid #fff}
.stu-av img{width:100%;height:100%;object-fit:cover;display:block}
.stu-nm{font-size:20px;font-weight:800;letter-spacing:.02em;text-align:center;
  max-width:100%;overflow-wrap:anywhere}
.stu-tag{font-size:13px;color:var(--ink3)}
.empty-tip{background:var(--amber-bg);border:1.5px solid var(--amber-line);border-radius:14px;
  padding:16px 18px;font-size:16px;color:var(--amber);margin:8px 0 0}
.go-learn{margin-top:14px;border:2px solid var(--blue-line);background:var(--blue-bg);
  color:var(--blue);border-radius:14px;padding:12px 22px;font-size:17px;font-weight:800;min-height:50px}
.go-learn:active{transform:scale(.97)}

/* ---------- 练习页 ---------- */
.play-top{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.who-av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--blue-bg);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:21px;font-weight:800;color:var(--blue)}
.who-av img{width:100%;height:100%;object-fit:cover;display:block}
.who-name{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcount{font-size:17px;font-weight:700;color:var(--ink2);white-space:nowrap}
.type-tabs{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px}
.type-tab{border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:11px 20px;font-size:17px;font-weight:700;color:var(--ink2);min-height:48px}
.type-tab.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.stage{background:var(--card);border:2px solid var(--line);border-radius:24px;
  padding:26px 22px 24px;min-height:420px}

/* ---------- 今日字卡（v18，进练习前先认一遍） ----------
   用户 2026-10-23：借鉴识字启蒙台，把「今天要学的字」摆在一屏，每张读一下再做题。
   主次：汉字是主角（76px），拼音 15px、组词 20px 只是提示；没组词就不留空位。 */
.pre-wrap{display:flex;flex-direction:column;gap:20px}
.pre-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pre-head h2{margin:0;font-size:26px;font-weight:800}
.pre-cnt{font-size:13px;font-weight:800;color:var(--ink3)}
.pre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.pre-card{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;min-height:176px;padding:26px 10px 20px;
  border:2px solid var(--line);border-radius:20px;background:#fff;
  font-family:inherit;cursor:pointer;transition:transform .12s,border-color .15s}
.pre-card:active{transform:scale(.97)}
.pre-card.read{border-color:var(--green);background:var(--green-bg)}
.pre-char{font-size:76px;font-weight:700;line-height:1.06;color:var(--ink)}
.pre-card.read .pre-char{color:var(--green)}
.pre-py{font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.pre-wd{font-size:20px;font-weight:700;color:var(--ink2);margin-top:2px}
.pre-idx{position:absolute;top:9px;left:12px;font-size:12px;font-weight:800;color:var(--ink3)}
.pre-st{position:absolute;top:7px;right:9px;font-size:11px;font-weight:800;
  padding:2px 7px;border-radius:999px}
.pre-st.m{background:var(--green-bg);color:var(--green)}
.pre-st.d{background:var(--blue-bg);color:var(--blue)}
.pre-st.t{background:var(--red-bg);color:var(--red)}
.pre-st.o{background:#EFEBE0;color:var(--ink3)}
.pre-tick{position:absolute;bottom:7px;right:10px;font-size:11.5px;font-weight:800;color:var(--green)}
.pre-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-top:1.5px dashed var(--line2);padding-top:16px}
.pre-tip{margin:0;font-size:12.5px;font-weight:700;color:var(--ink3)}
.pre-go{margin-left:auto;min-height:62px;padding:0 36px;border:none;border-radius:20px;
  background:var(--green);color:#fff;font-family:inherit;font-size:22px;font-weight:800;
  letter-spacing:.02em;cursor:pointer}
.pre-go:active{transform:scale(.97)}
.pre-go.off{background:#CFC7B4;color:#fff}
/* 预习阶段还没开题：老师辅助按钮点了没反应，直接藏起来；
   留下「换下一个同学」一个操作，标签也别孤零零挂着 */
.is-pre #btnHint,.is-pre #btnSkip,.is-pre #btnRight,.is-pre .help-label{display:none}
.is-pre .help-bar{justify-content:flex-end}

/* ---------- 我的主页（v24，T-014 第 2 期） ----------
   用户 2026-10-23：「学生端应该有自己的界面，看到自己的进度…然后才是按钮开启今日学习」。
   一屏只讲四件事：我是谁 / 学到哪了 / 今天练什么 / 一个大按钮。
   刻意不做：排行榜、虚拟货币、多页签——跨学生比较对这些孩子没好处，选项越多越分心。 */
.home-wrap{display:flex;flex-direction:column;gap:18px}
.home-hero{display:flex;align-items:center;gap:22px;
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px 24px}
.home-who{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.home-av{width:64px;height:64px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;background:var(--green-bg);
  border:2px solid var(--green-line);color:var(--green);font-size:26px;font-weight:800;overflow:hidden}
.home-av img{width:100%;height:100%;object-fit:cover}
.home-nm{min-width:0}
.home-nm h2{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.home-hi{margin:3px 0 0;font-size:13px;font-weight:700;color:var(--ink3)}
/* 圆环沿用进度页那一套（ringHTML），主页面这里小一号，和头像同一行 */
.home-hero .ring-wrap,.home-hero .ring{width:112px;height:112px}
.home-hero .ring-txt b{font-size:28px}
.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.home-stats .hs{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.home-stats .hs b{font-size:26px;font-weight:800;line-height:1.1}
.home-stats .hs span{font-size:11.5px;font-weight:800;color:var(--ink3)}
.home-stats .hs.m b{color:var(--green)}
.home-stats .hs.o b{color:var(--ink3)}
.home-stats .hs.d b{color:var(--blue)}
.home-badges{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home-stars{display:inline-flex;gap:3px}
.home-star{font-size:21px;line-height:1;color:#DCD5C4}
.home-star.on{color:#E0A82E}
.home-streak{font-size:12.5px;font-weight:800;color:var(--amber);
  background:var(--amber-bg);border-radius:999px;padding:4px 12px}
.home-today{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px}
.home-today-hd{font-size:15px;font-weight:800;margin-bottom:12px}
.home-chips{display:flex;flex-wrap:wrap;gap:9px}
.home-chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:60px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:30px;font-weight:700;line-height:1.1}
.home-chip i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--blue);margin-top:1px}
.home-chip.m{border-color:var(--green-line);background:var(--green-bg);color:var(--green)}
.home-chip.d{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.home-chip.t{border-color:var(--red-line);background:var(--red-bg);color:var(--red)}
.home-chip.o{color:var(--ink2)}
.home-note{margin:12px 0 0;font-size:11.5px;font-weight:700;color:var(--ink3)}
.home-foot{display:flex}
.home-go{width:100%;min-height:70px;border:none;border-radius:22px;background:var(--green);
  color:#fff;font-family:inherit;font-size:23px;font-weight:800;letter-spacing:.02em;cursor:pointer}
.home-go:active{transform:scale(.98)}
.home-go.off{background:#CFC7B4}
/* 右上角那个「1 / 8」是题号，主页上显示成「主页 / 24」只会被误读成页码，直接藏 */
.is-home .qcount{display:none}
/* 字卡页多一个「返回主页」：主页 ↔ 字卡要能一层层退，不能一下跳回选人页 */
.pre-foot .pre-tip{flex:1 1 auto}
.pre-foot .pre-go{margin-left:0}
.pre-back{min-height:52px;padding:0 24px;border:1.5px solid var(--line2);
  border-radius:16px;background:#fff;color:var(--ink2);font-family:inherit;
  font-size:15px;font-weight:800;cursor:pointer}
.pre-back:active{transform:scale(.97)}
.q-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.q-ask{font-size:19px;font-weight:700;color:var(--ink2)}
.q-progress{margin-left:auto;font-size:15px;color:var(--ink3)}
/* 读题按钮：不认字的孩子靠它听题，必须够大够显眼 */
.read-btn{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  min-height:50px;padding:8px 18px;border:2px solid var(--blue-line);
  background:var(--blue-bg);border-radius:999px;color:var(--blue);
  font-size:17px;font-weight:800;letter-spacing:.04em}
.read-btn svg{width:21px;height:21px}
.read-btn:active{transform:scale(.95);background:#D3E4F7}
.read-hint{margin:-8px 0 14px;color:var(--amber);font-weight:700;line-height:1.5}
.speaker{width:78px;height:78px;border-radius:50%;background:var(--blue-bg);border:2.5px solid var(--blue-line);
  display:flex;align-items:center;justify-content:center;flex:none}
.speaker:active{background:#D3E5F7;transform:scale(.95)}
.pinyin-hint{font-size:15px;color:var(--ink3);font-weight:700}
.fallback-tip{font-size:14px;color:var(--amber);background:var(--amber-bg);
  border-radius:10px;padding:8px 12px;display:inline-block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{background:#fff;border:3px solid var(--line2);border-radius:20px;
  min-height:132px;display:flex;align-items:center;justify-content:center;
  font-size:62px;font-weight:700;letter-spacing:.04em;color:var(--ink);
  padding:10px;overflow-wrap:anywhere;line-height:1.1}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt.dim{opacity:.35}
/* 点错的那个：灰掉 + 抖一下 + 不能再点，但题目不结束、其余选项照旧可点（T-016）。
   汉字要还能看清（孩子得知道自己试过哪个），所以不用游戏里那种 opacity:.34 的淡出。 */
.opt.miss{border-color:#e2e2e6;border-style:dashed;background:#f4f4f6;color:#bdbdc3;
  animation:shake .4s ease;pointer-events:none}
/* ---------- 拼词语：上面是待填的词位，下面是散乱的字块 ---------- */
.wb-slots{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:2px 0 22px}
.wb-slots-lb{flex:1 1 100%;text-align:center;font-size:14px;font-weight:700;
  color:var(--ink3);letter-spacing:.08em}
.wb-slot{display:flex;gap:6px;padding:7px;border-radius:15px;
  background:#F6F0E1;border:2px dashed #D9CFB6}
.wb-slot em{display:block;width:44px;height:44px;border-radius:10px;
  background:var(--card);border:1px solid var(--line)}
.wb-slot.on{padding:0 18px;min-height:60px;align-items:center;
  border:2px solid var(--green-line);background:var(--green-bg);
  font-size:34px;font-weight:800;color:var(--green);letter-spacing:4px}
.wb-tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:4px 0}
.wb-tile{width:112px;height:112px;border-radius:22px;background:var(--card);
  border:3px solid #D6CDB6;box-shadow:0 4px 0 #E4DCC8;
  font-size:60px;font-weight:800;color:var(--ink);line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease,box-shadow .1s ease,border-color .12s ease,background .12s ease}
.wb-tile:active{transform:translateY(3px);box-shadow:0 1px 0 #E4DCC8}
.wb-tile.sel{border-color:var(--blue);background:var(--blue-bg);
  transform:translateY(-5px);box-shadow:0 9px 0 #CFE0F2}
.wb-tile.used{border-color:var(--green-line);background:var(--green-bg);
  color:#8FB8A1;box-shadow:none;opacity:.8}
.wb-tile.shake{animation:wbShake .42s ease}
.wb-tile.hinted{animation:wbPulse .8s ease-in-out 3}
.wb-tip{text-align:center;font-size:17px;font-weight:700;color:var(--ink2);margin-top:16px}
@keyframes wbShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes wbPulse{0%,100%{box-shadow:0 4px 0 #E4DCC8}
  50%{box-shadow:0 0 0 7px var(--amber-line);border-color:var(--amber)}}
.big-char{font-size:150px;font-weight:700;line-height:1.05;text-align:center;
  letter-spacing:.06em;color:var(--ink);margin:14px 0 6px}
.big-pinyin{font-size:34px;text-align:center;color:var(--blue);font-weight:700;margin:0 0 10px}
.big-word{font-size:26px;text-align:center;color:var(--ink2);font-weight:700;margin:6px 0 0}
.art-big{display:flex;justify-content:center;margin:6px 0 10px}
.art-big svg{width:200px;height:200px}
.art-big img{width:200px;height:200px;object-fit:contain;border-radius:16px}
.drag-zone{display:flex;flex-direction:column;align-items:center;gap:6px}
.drag-item{width:190px;height:190px;border-radius:22px;border:3px dashed var(--blue-line);
  background:var(--blue-bg);display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none}
.drag-item svg{width:150px;height:150px}
.drag-item img{width:150px;height:150px;object-fit:contain;border-radius:14px}
.drag-item.dragging{opacity:.5}
/* 没有图可画的字：改用组词，目标字标红 */
.drag-item.word{width:230px;height:150px;border-style:solid;background:var(--card)}
.word-card{font-size:56px;font-weight:700;line-height:1.1;text-align:center;letter-spacing:2px}
.word-card i{font-style:normal;color:var(--red)}
.opt.drop-on{border-color:var(--blue);background:var(--blue-bg)}
.feedback{display:flex;align-items:center;gap:14px;margin-top:20px;padding:16px 18px;
  border-radius:16px;font-size:19px;font-weight:800}
.feedback.ok{background:var(--green-bg);color:var(--green);border:2px solid var(--green-line)}
.feedback.no{background:var(--red-bg);color:var(--red);border:2px solid var(--red-line)}
.feedback.info{background:var(--amber-bg);color:var(--amber);border:2px solid var(--amber-line)}
.star-row{display:flex;gap:8px;margin-top:10px}
.help-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px}
.help-label{font-size:14px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.help-btn{border:2px solid var(--line2);background:#fff;border-radius:12px;
  padding:10px 16px;font-size:16px;font-weight:700;color:var(--ink2);min-height:46px}
.help-btn.ok{border-color:var(--green-line);background:var(--green-bg);color:var(--green)}
.help-btn.next{margin-left:auto;border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.help-btn:disabled{opacity:.4}
.help-btn:active{transform:scale(.97)}

/* 跟读的大按钮：孩子不认字，按钮要有分量、要明确指向「下一步」 */
.read-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0 6px}
.read-next{min-height:76px;min-width:min(360px,84vw);padding:0 36px;border:none;border-radius:26px;
  background:linear-gradient(180deg,#43C878,#2C9F58);color:#fff;font-size:24px;font-weight:900;
  letter-spacing:.02em;cursor:pointer;touch-action:manipulation;
  box-shadow:0 6px 0 #1F7A42,0 14px 24px rgba(34,122,67,.26);
  transition:transform .1s ease,box-shadow .1s ease}
.read-next:active{transform:translateY(4px);box-shadow:0 2px 0 #1F7A42,0 6px 12px rgba(34,122,67,.22)}
.read-next:disabled{opacity:.45;box-shadow:0 6px 0 #1F7A42}
.read-tip{font-size:15px;font-weight:700;color:var(--ink3)}

/* ---------- 老师端 ---------- */
.tea-top{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.tea-top h2{margin:0;font-size:26px;font-weight:800;flex:1}
/* 版本角标：老师一眼能看到当前版本 + 内置词条数，报问题时说一句就够 */
.app-ver{font-size:12px;font-weight:800;color:#6F6A5C;background:#F1EFE6;
  border:1px solid #E2DECF;border-radius:9px;padding:4px 8px;white-space:nowrap}
.tea-tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px}
.tea-tab{border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:10px 18px;font-size:16px;font-weight:700;color:var(--ink2);min-height:46px}
.tea-tab.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
.panel h3{margin:0 0 12px;font-size:19px;font-weight:800}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
/* 长列表（字库 700 行）在容器里自己滚，别把整页撑成 4 万多像素——
   否则「新增/编辑」表单被顶到页面最底下，老师点完按钮什么都看不见 */
#tpLib .list-wrap,#tpWord .list-wrap{max-height:min(56vh,620px);overflow:auto}
/* 编辑表单是「展开的卡片」，要一眼看出这是正在填的东西，不是列表的一部分 */
#stuForm,#libForm,#wdForm{background:#FFFDF6;border:2px solid var(--amber-line);
  border-radius:16px;padding:14px 16px 16px;margin:2px 0 16px;
  box-shadow:0 6px 18px rgba(138,106,24,.10)}
#stuForm h3,#libForm h3,#wdForm h3{margin:0 0 10px;font-size:17px;color:var(--ink)}
/* 学生表单很长（字表要滚好几屏），「保存」也跟着粘在视口底部，别让人找不到 */
#stuForm>.row:last-child,#libForm>.row:last-child,#wdForm>.row:last-child{
  position:sticky;bottom:6px;z-index:2;background:#FFFDF6;
  border-top:1px dashed var(--amber-line);padding:10px 0 4px;margin-top:6px}
/* 校验没通过的控件要自己「举手」，不能让老师猜哪儿填错了 */
.field-err{outline:3px solid var(--red);outline-offset:2px;border-radius:10px;
  background:var(--red-bg);animation:errShake .32s ease-in-out 2}
.field-err-box{outline:3px solid var(--red);outline-offset:4px;border-radius:12px;
  background:var(--red-bg);animation:errShake .32s ease-in-out 2}
@keyframes errShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:120px}
.fld-hint{display:block;margin-top:5px;font-size:12px;font-weight:700;color:var(--ink3);line-height:1.45}
.fld label{font-size:13px;font-weight:800;color:var(--ink3)}
.fld input[type=text],.fld input[type=number],.fld select{
  border:1.5px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff;min-height:42px}
.fld input[type=file]{font-size:13px}
.primary{border:2px solid var(--green-line);background:var(--green-bg);color:var(--green);
  border-radius:12px;padding:10px 20px;font-size:16px;font-weight:800;min-height:46px}
.secondary{border:2px solid var(--line2);background:#fff;color:var(--ink2);
  border-radius:12px;padding:10px 18px;font-size:15px;font-weight:700;min-height:44px}
.danger{border:2px solid var(--red-line);background:var(--red-bg);color:var(--red);
  border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;min-height:40px}
/* 表格里的操作键：7 列一行塞得下，不能按 46px 高铺开 */
.primary.sm,.secondary.sm{padding:7px 11px;font-size:13.5px;min-height:38px;border-radius:10px}
.chk-row{display:flex;gap:14px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;
  background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;min-height:42px}
.chk input{width:19px;height:19px}
/* ---- 学生字表（T-005）：组头可展开，字一枚 chip 点一下切换 ---- */
.char-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.char-stat{font-size:14.5px;font-weight:700;color:var(--ink2)}
.char-stat b{font-size:18px;color:var(--ink)}
.char-warn{color:var(--amber);font-weight:800;font-size:13.5px}
.char-search{flex:1;min-width:180px;min-height:44px;border:1.5px solid var(--line);
  border-radius:11px;padding:0 13px;font-size:15px;background:#fff;color:var(--ink)}
.char-list{max-height:340px;overflow:auto;border:1.5px solid var(--line);border-radius:14px;
  background:#FDFBF4;padding:8px}
.char-grp{background:#fff;border:1.5px solid #E8E1CF;border-radius:12px;margin-bottom:8px}
.char-grp:last-child{margin-bottom:0}
.char-g-head{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px}
.char-g-tog{flex:1;display:flex;align-items:center;gap:9px;min-height:44px;padding:0 8px;
  background:transparent;border:0;text-align:left;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.char-g-arrow{width:16px;color:var(--ink3);font-size:13px}
.char-g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-g-cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap}
.char-g-all{min-height:40px;padding:0 13px;border-radius:10px;border:1.5px solid var(--blue-line);
  background:var(--blue-bg);color:var(--blue);font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.char-g-all.on{border-color:var(--line2);background:#F4EFE1;color:var(--ink3)}
.char-chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 12px}
.char-chip{min-width:44px;min-height:44px;padding:0 10px;border-radius:11px;
  border:1.5px solid #CFC3A6;background:#FFFDF7;color:var(--ink2);
  font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.char-chip.on{border-color:var(--blue);background:var(--blue);color:#fff;
  box-shadow:0 2px 0 rgba(24,95,165,.22)}
.char-chip:active{transform:scale(.96)}
.char-sec{font-size:13.5px;font-weight:800;color:var(--ink3);padding:4px 6px 8px}
.char-empty{font-size:14px;color:var(--ink3);padding:14px 10px;text-align:center}
.list-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:#fff}
table.grid{width:100%;border-collapse:collapse;font-size:15px}
table.grid th{background:#F4EFE1;text-align:left;padding:10px 12px;font-weight:800;
  font-size:13px;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
table.grid td{padding:9px 12px;border-top:1px solid #EFE8D8;vertical-align:middle}
table.grid tr.on td{background:#FFF8E6}
.lib-cell{font-size:26px;font-weight:700}
/* 内置派生行：灰一点、浅底色，一眼看出「不用你维护」 */
tr.tr-builtin td{background:#FBFAF3}
.sp-builtin{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:7px;
  background:#E9F0E4;color:#3C6B39;font-size:11px;font-weight:800;vertical-align:middle;
  white-space:nowrap}
.td-dim{color:#8A8578}
.mini-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--blue-bg);
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--blue);
  vertical-align:middle;margin-right:8px}
.mini-av img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.b{background:var(--blue-bg);color:var(--blue)}
.pill.a{background:var(--amber-bg);color:var(--amber)}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.gy{background:#EFEBE0;color:var(--ink3)}
.matrix{display:grid;gap:3px;overflow-x:auto;padding-bottom:6px}
.mx-row{display:grid;gap:3px;align-items:center}
.mx-cell{height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800}
.mx-name{font-size:14px;font-weight:700;padding-right:8px;white-space:nowrap}
.mx-head{font-size:11.5px;font-weight:800;color:var(--ink3);text-align:center;padding-bottom:2px}
.mx-c0{background:#EFEBE0;color:#A8A296}
.mx-c1{background:var(--amber-bg);color:var(--amber)}
.mx-c2{background:var(--blue-bg);color:var(--blue)}
.mx-c3{background:var(--green-bg);color:var(--green)}
.mx-c4{background:var(--red-bg);color:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:10px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* 图例色块用实色，跟进度条一致（旧版是浅底色，看着像没上色） */
.legend i.mx-c3{background:var(--green)} .legend i.mx-c2{background:#5B9BD5}
.legend i.mx-c4{background:var(--red)} .legend i.mx-c0{background:#DCD5C4}

/* ---------- 进度页头图（v17） ----------
   老师原话「特别丑、不清晰、都堆在一起、不够可视化、解释文字太显眼」。
   旧版是 6 张同款数字卡 + 一大段灰字说明，数字全一个样子，看不出谁掉队。
   现在：一圈掌握率 + 一条四段占比 + 三个小胶囊；解释文字只剩 11.5px 灰字。 */
.prog-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.prog-head h3{margin:0}
.prog-meta{font-size:13px;font-weight:800;color:var(--ink3)}
.prog-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring{width:132px;height:132px;display:block}
.ring-bg{fill:none;stroke:#EFEBE0;stroke-width:12}
.ring-fg{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-txt b{font-size:33px;font-weight:800;line-height:1;color:var(--green);letter-spacing:-.02em}
.ring-txt span{font-size:11.5px;font-weight:800;color:var(--ink3);margin-top:3px}
.hero-main{min-width:0}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#EFEBE0;gap:2px}
.stack i{display:block;height:100%}
.stack.is-empty{background:#F3EFE3}
.stack-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.slg{display:flex;align-items:center;gap:6px;min-width:0}
.slg i{width:9px;height:9px;border-radius:3px;flex:none}
.slg b{font-size:21px;font-weight:800;line-height:1}
.slg span{font-size:12px;font-weight:700;color:var(--ink3)}
.slg.m i{background:var(--green)} .slg.m b{color:var(--green)}
.slg.d i{background:#5B9BD5} .slg.d b{color:var(--blue)}
.slg.t i{background:var(--red)} .slg.t b{color:var(--red)}
.slg.o i{background:#DCD5C4} .slg.o b{color:var(--ink3)}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hp{font-size:12.5px;font-weight:700;color:var(--ink2);background:#F4F0E2;
  border-radius:999px;padding:5px 12px}
.hp b{font-weight:800;color:var(--ink);margin-right:2px}
.prog-empty{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ink3);
  background:#FAF7EC;border:1.5px dashed var(--line2);border-radius:999px;padding:8px 16px}

/* ---------- 学生档案 + 进度（T-006 / v12） ----------
   四态配色统一在一处：绿=已掌握，蓝=练习中，红=需巩固，米灰=待学。
   进度条一律按「学生自己的字表」画，段落宽度＝各态字数占比。 */
.prog-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#EFEBE0;gap:1px}
.prog-bar.big{height:16px;border-radius:8px}
.prog-bar i{display:block;height:100%}
.prog-mini{display:flex;width:122px;height:9px;border-radius:999px;overflow:hidden;background:#EFEBE0;gap:1px}
.prog-mini i{display:block;height:100%}
.pg-m,.pm-m{background:var(--green)}
.pg-d,.pm-d{background:#5B9BD5}
.pg-t,.pm-t{background:var(--red)}
.pg-o,.pm-o{background:#DCD5C4}
.stu-prog{display:flex;flex-direction:column;gap:5px;min-width:132px}
.pm-txt{font-size:12.5px;color:var(--ink3);font-weight:700;white-space:nowrap}
.pm-txt b{color:var(--green);font-size:13.5px}
.lg-m{color:var(--green)} .lg-d{color:var(--blue)}
.lg-t{color:var(--red)} .lg-o{color:var(--ink3)}

.prof-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 16px}
.prof-who{display:flex;align-items:center;gap:12px;flex:1;min-width:180px}
.prof-av{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--blue-bg);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;
  color:var(--blue);flex:none;border:2px solid #fff}
.prof-av img{width:100%;height:100%;object-fit:cover;display:block}
.prof-who-t{display:flex;flex-direction:column;min-width:0}
.prof-who-t b{font-size:23px;font-weight:800;letter-spacing:.02em}
.prof-meta{font-size:13px;color:var(--ink3);font-weight:700}
.prof-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.prof-stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.prof-stat b{display:block;font-size:27px;font-weight:800;line-height:1.15}
.prof-stat span{font-size:12.5px;color:var(--ink3);font-weight:700}
.prof-stat.m b{color:var(--green)}
.prof-stat.d b{color:var(--blue)}
.prof-stat.t b{color:var(--red)}
.prof-stat.o b{color:var(--ink3)}
.prof-band{margin-bottom:4px}
.prof-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);
  margin-top:9px;font-weight:700}
.prof-h{margin:24px 0 10px;font-size:17px;font-weight:800;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prof-hint{font-size:12.5px;color:var(--ink3);font-weight:600}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pgc{min-width:56px;min-height:56px;border-radius:12px;border:2px solid transparent;
  font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pgc:active{transform:scale(.96)}
.pgc-m{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.pgc-d{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.pgc-t{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.pgc-o{background:#F1ECDF;color:#948E80;border-color:#E2DAC6}
.pgc.on{box-shadow:0 0 0 3px #185FA5 inset}
/* v19 在学标记：在学的那几个字右上角一个小蓝点 + 实线描边，排队中的不给描边 */
.pgc{position:relative}
.pgc.in-act{border-color:var(--blue);border-style:solid}
.pgc.in-act::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;
  border-radius:50%;background:var(--blue)}
.pgc-lk{position:absolute;bottom:4px;right:5px;width:7px;height:7px;border-radius:2px;
  background:var(--amber)}
.pd-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pd-stage{font-size:12.5px;font-weight:800;color:var(--ink3);background:#F4F0E2;
  border-radius:999px;padding:5px 12px}
.pd-act .secondary.on{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.pgc-w{background:#fff;color:var(--ink3);border-color:var(--line2);border-style:dashed;font-size:15px;font-weight:800}
.prof-detail{margin-top:12px;background:#fff;border:1.5px solid var(--blue-line);
  border-radius:14px;padding:14px 16px}
.pd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pd-top b{font-size:26px;font-weight:800}
.pd-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--ink3);font-weight:700}
.pd-row b{display:block;font-size:18px;color:var(--ink);font-weight:800}
.pd-tip{margin:8px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.prof-focus{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:52px}
.pf-chip{min-width:54px;min-height:52px;padding:0 10px;border-radius:12px;font-size:25px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid}
.prof-acts{margin-top:18px;gap:10px;flex-wrap:wrap}
.prof-acts button{min-height:48px}

/* 进度总览：一个学生一行；条要粗、百分比要大，掉队的条一眼就短 */
.prog-block{margin-top:24px}
.prog-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.prog-h h4{margin:0;font-size:16.5px;font-weight:800}
.prog-note{font-size:11.5px;font-weight:700;color:var(--ink3)}
.prow{display:grid;grid-template-columns:minmax(140px,196px) 1fr 62px 78px;
  gap:14px;align-items:center;padding:11px 14px;border-radius:14px;
  background:#fff;border:1.5px solid var(--line);margin-bottom:8px}
.prow-name{display:flex;align-items:center;gap:9px;min-width:0}
.prow-name .mini-av{width:32px;height:32px;font-size:15px}
.pn-txt{display:flex;flex-direction:column;min-width:0}
.pn-txt b{font-size:15.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-txt em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-mini{display:flex;width:100%;height:12px;border-radius:999px;overflow:hidden;
  background:#EFEBE0;gap:2px}
.prog-mini i{display:block;height:100%}
.prow-none{color:var(--ink3);font-weight:800;font-size:13px}
.prow-rate{text-align:right;white-space:nowrap;color:var(--green)}
.prow-rate b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.prow-rate i{font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink3);margin-left:1px}
.prow-btn{border:1.5px solid var(--line2);background:var(--card);border-radius:11px;
  padding:8px 6px;font-size:13.5px;font-weight:800;color:var(--ink2);min-height:42px}
.prow-btn:active{background:#F0EADC}
.hard-wrap{display:flex;flex-wrap:wrap;gap:9px}
.hard-chip{display:inline-flex;align-items:center;gap:9px;background:#fff;
  border:1.5px solid var(--red-line);border-radius:13px;padding:8px 13px}
.hard-chip b{font-size:24px;color:var(--red);font-weight:700;line-height:1}
.hard-chip em{font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:800}
.need-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:8px}
.need-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.need-top b{font-size:15px;font-weight:800}
.need-chars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.need-chars span{background:var(--red-bg);color:var(--red);border-radius:9px;
  padding:4px 11px;font-size:22px;font-weight:700}
.need-chars span.a{background:var(--amber-bg);color:var(--amber)}

/* 抽练条：从档案「只练这几个字」进练习时，必须让孩子和老师都看得见这次只练哪几个 */
.drill-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--amber-bg);border:1.5px solid var(--amber-line);border-radius:13px;
  padding:9px 14px;margin:0 0 12px;font-size:14px;font-weight:800;color:var(--amber)}
.drill-bar .db-chars{display:flex;gap:6px;flex-wrap:wrap}
.drill-bar .db-chars b{background:#fff;border:1.5px solid var(--amber-line);border-radius:8px;
  padding:1px 9px;font-size:20px;color:var(--ink)}
.drill-bar button{margin-left:auto;border:1.5px solid var(--amber-line);background:#fff;
  border-radius:9px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--amber);min-height:36px}
.tips{font-size:14px;color:var(--ink3);margin:10px 2px 0;line-height:1.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:99;
  background:#20303C;color:#fff;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;
  max-width:88vw;text-align:center}
.sync{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink3)}
.sync.off{color:var(--amber)}
.sync.err{color:var(--red)}
.offline-note{margin:0 0 14px;padding:12px 16px;border-radius:12px;
  background:#FFF0E4;border:1px solid #E9A96A;color:#8A4A06;
  font-size:16px;line-height:1.55;font-weight:700}
.offline-note span{font-weight:400;font-size:14px}
.backup-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 0 16px;padding:10px 14px;border-radius:12px;
  background:#F4F0E4;border:1px solid #E3DCC9}
.backup-bar .bk-tip{font-size:14px;color:var(--ink3);margin-right:auto}
.backup-bar button{min-height:40px;padding:0 16px;font-size:15px}

/* ============================================================
   认字乐园（首页）+ 四款找字小游戏
   ============================================================ */
/* ---------- 主导航 ---------- */
.main-nav{position:sticky;top:0;z-index:30;background:rgba(247,243,232,.96);
  border-bottom:1.5px solid var(--line);backdrop-filter:blur(8px)}
.nav-in{max-width:1080px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:8px}
.nav-logo{font-size:16px;font-weight:800;color:var(--ink3);letter-spacing:.06em;margin-right:auto}
.nav-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 22px;font-size:17px;font-weight:800;color:var(--ink2);min-height:44px}
.nav-btn.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.nav-btn:active{transform:scale(.96)}
.nav-teach{border:1.5px solid var(--line2);background:var(--card);border-radius:10px;
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink3);min-height:38px;margin-left:6px}
.nav-teach:active{background:#F0EADC}
.nav-av{display:flex;align-items:center;justify-content:center;width:42px;height:42px;
  border:1.5px solid var(--line2);background:var(--card);border-radius:12px;
  color:var(--blue);padding:0;flex:0 0 auto}
.nav-av svg{width:22px;height:22px}
.nav-av:active{background:var(--blue-bg)}
.nav-av.off{color:var(--ink3);background:#F0EADC}

/* ---------- 乐园头部 ---------- */
.learn-hero{padding:8px 2px 14px}
.learn-hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.03em}
.learn-hero p{margin:5px 0 0;font-size:16px;color:var(--ink2)}
.learn-search{display:flex;align-items:center;gap:10px;background:#fff;
  border:2px solid var(--line2);border-radius:16px;padding:0 14px;margin-bottom:14px}
.learn-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(24,95,165,.1)}
.ls-ico{width:22px;height:22px;flex:none}
.learn-search input{flex:1;border:none;background:none;outline:none;
  font-size:18px;padding:14px 0;min-height:52px;color:var(--ink);min-width:0}
.learn-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.ls-clear{border:1.5px solid var(--line2);border-radius:10px;padding:7px 12px;
  font-size:14px;font-weight:700;color:var(--ink2);background:var(--card);flex:none}

/* ---------- 册次条 ---------- */
.stage-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.stage-chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 18px;font-size:16px;font-weight:700;color:var(--ink2);min-height:44px;white-space:nowrap}
.stage-chip b{font-weight:800;color:var(--ink3);font-size:13px;margin-left:6px}
.stage-chip.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.stage-chip.on b{color:var(--green)}
.stage-chip:active{transform:scale(.97)}

.learn-bar{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.learn-count{font-size:14px;color:var(--ink3);font-weight:700;margin-right:auto}
.play-all{border:2px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);
  border-radius:12px;padding:10px 18px;font-size:16px;font-weight:800;min-height:46px}
.play-all:active{transform:scale(.97)}

/* ---------- 字卡网格 ---------- */
.grp{margin-bottom:16px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;
  color:var(--ink2);margin:0 0 9px;padding-left:2px;letter-spacing:.02em}
.grp-h b{font-size:12.5px;font-weight:800;color:var(--ink3);background:#EFEBE0;
  border-radius:999px;padding:2px 9px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.ch-card{position:relative;background:#fff;border:2px solid var(--line2);border-radius:16px;
  padding:14px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:122px;justify-content:center;transition:transform .07s ease,border-color .12s ease;
  content-visibility:auto;contain-intrinsic-size:122px}
.ch-card:active{transform:scale(.94);border-color:var(--blue)}
.ch-card:hover{border-color:var(--blue-line)}
.ch-big{font-size:46px;font-weight:700;line-height:1.02;letter-spacing:.02em}
.ch-py{font-size:13px;font-weight:700;color:var(--blue);line-height:1.2}
.ch-wd{font-size:12px;color:var(--ink3);max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.ch-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;
  background:var(--green-line)}

/* ---------- 学字卡抽屉 ---------- */
.sheet-mask{position:fixed;inset:0;z-index:60;background:rgba(20,26,32,.45);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--card);
  border-radius:26px 26px 0 0;padding:16px 20px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;margin-bottom:10px}
.sheet-eyebrow{font-size:14px;font-weight:800;color:var(--ink3);letter-spacing:.06em;margin-right:auto}
.sheet-x{border:1.5px solid var(--line2);background:#fff;border-radius:10px;
  padding:8px 14px;font-size:15px;font-weight:700;color:var(--ink2);min-height:40px}
.sheet-body{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.sheet-left{flex:none;width:132px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sheet-art{width:132px;height:132px;border-radius:18px;background:var(--blue-bg);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.sheet-art:empty{display:none}
.sheet-art svg{width:124px;height:124px}
.sheet-art img{width:132px;height:132px;object-fit:contain;display:block;border-radius:18px}
.sheet-word{font-size:22px;font-weight:700;color:var(--ink2);letter-spacing:1px;
  line-height:1.3;margin:2px 0 10px}
.sheet-word:empty{display:none}
.sheet-word i{font-style:normal;color:var(--red)}
.sheet-word .lb{font-size:13px;font-weight:700;color:var(--ink3);
  margin-right:8px;letter-spacing:0}
/* 没有配图时：左边整列收掉，字居中，避免「字卡」看起来像「词卡」 */
.sheet.no-art .sheet-right{text-align:center}
.sheet.no-art .sheet-actions{justify-content:center}
.sheet-right{flex:1;min-width:0}
.sheet-char{font-size:86px;font-weight:700;line-height:1.02;letter-spacing:.04em}
.sheet-py{font-size:24px;font-weight:700;color:var(--blue);margin-bottom:10px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap}
.sheet-actions button{min-height:44px;padding:8px 16px;font-size:15px}
.sheet-games{margin-top:4px}
.sg-title{font-size:14px;font-weight:800;color:var(--ink3);letter-spacing:.06em;margin-bottom:10px}
.sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sg-btn{background:#fff;border:2px solid var(--line2);border-radius:18px;padding:14px 14px 13px;
  display:flex;flex-direction:column;gap:3px;text-align:left;min-height:104px;
  transition:transform .08s ease,border-color .12s ease}
.sg-btn:active{transform:scale(.97)}
.sg-btn .sg-nm{font-size:19px;font-weight:800;color:var(--ink)}
.sg-btn .sg-d{font-size:12.5px;color:var(--ink3);line-height:1.35}
.sg-btn.gb:hover{border-color:#9CC2E4}
.sg-btn.gf:hover{border-color:#7FB8DA}
.sg-btn.gr:hover{border-color:#9CC7AC}
.sg-btn.ga:hover{border-color:#E2C97E}
.sg-ico{width:34px;height:34px;border-radius:50%;margin-bottom:4px}
.sg-ico.bub{background:radial-gradient(circle at 32% 28%,#fff 0%,#DCEFFC 40%,#B9DCF6 100%);
  border:2px solid #9CC2E4}
.sg-ico.fis{background:#CDE9F7;border:2px solid #7FB8DA;border-radius:50% 50% 46% 46%/60% 60% 40% 40%}
.sg-ico.fru{background:radial-gradient(circle at 35% 30%,#FFD98A,#F0A24B);border:2px solid #D08A3C;border-radius:50%}
.sg-ico.fed{background:#E2EFD4;border:2px solid #9CC7AC;border-radius:8px}

/* ---------- 游戏屏 ---------- */
.game-screen{padding-top:12px}
.game-top{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.game-name{font-size:20px;font-weight:800;margin-right:auto}
.game-score-box{font-size:16px;font-weight:700;color:var(--ink2);white-space:nowrap}
.game-score-box b{font-size:22px;color:var(--green);margin-left:4px}
.game-ask{display:flex;align-items:center;gap:14px;margin-bottom:12px;
  background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px}
.game-spk{height:56px;padding:0 17px;border-radius:999px;background:var(--blue-bg);
  border:2.5px solid var(--blue-line);display:inline-flex;align-items:center;gap:7px;
  color:var(--blue);font-size:16px;font-weight:800;flex:none;transition:transform .08s ease}
.game-spk svg{width:23px;height:23px}
.game-spk:active{transform:scale(.93);background:#D3E5F7}
.game-ask-txt{flex:1;min-width:0}
.ga-label{font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.06em}
.ga-word{display:flex;align-items:baseline;gap:12px;min-height:44px}
.ga-word b{font-size:44px;font-weight:700;line-height:1.1}
.ga-word i{font-style:normal;font-size:20px;font-weight:700;color:var(--blue)}
/* max-height 按 80vw 封顶：窄屏时避免场景被拉成竖长条（果树/钓鱼是等比缩放的 SVG，
   场景越竖越容易被纵向拉长，树干就会重新变细） */
.game-field{position:relative;height:clamp(320px,calc(100vh - 250px),620px);min-height:320px;
  max-height:min(620px,80vw);
  border-radius:24px;border:2px solid var(--line);overflow:hidden;
  background:var(--card);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.game-foot{display:flex;align-items:center;justify-content:space-between;
  padding:10px 4px 0;font-size:14px;color:var(--ink3);font-weight:700}
.game-tip{color:var(--ink3)}
#gameProg{font-size:15px;color:var(--ink2)}

/* 通用可点物件 */
.g-cell{display:flex;align-items:center;justify-content:center}
.g-item{cursor:pointer;border:none;background:none;padding:0;
  transition:transform .12s cubic-bezier(.3,1.4,.5,1);touch-action:manipulation}
.g-item:active{transform:scale(.94)}
.g-item.miss{animation:shake .4s ease;opacity:.34;filter:grayscale(1);pointer-events:none}

/* 得分飘字 / 捕获飞行 / 战利品计数（四场景共用，操作后必须看得见变化） */
.fx-score{position:absolute;z-index:9;transform:translate(-50%,-50%);
  font-size:31px;font-weight:800;color:#DC8B00;pointer-events:none;
  text-shadow:0 2px 0 #fff,0 0 16px rgba(255,255,255,.98);
  animation:fxFloat .92s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fxFloat{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  22%{opacity:1;transform:translate(-50%,-76%) scale(1.16)}
  100%{opacity:0;transform:translate(-50%,-165%) scale(1)}}
.fx-fly{position:absolute;z-index:9;transform:translate(-50%,-50%);
  font-size:22px;font-weight:800;color:#4A3010;pointer-events:none;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
  animation:flyTo .58s cubic-bezier(.4,0,.6,1) forwards}
@keyframes flyTo{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  68%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.34)}}
.game-loot{position:absolute;right:12px;top:10px;z-index:7;display:flex;align-items:center;
  gap:6px;background:rgba(255,255,255,.88);border:2px solid var(--line);border-radius:999px;
  padding:3px 13px 3px 8px;font-size:15px;font-weight:800;color:var(--ink2);
  box-shadow:0 4px 12px rgba(60,80,40,.12)}
.game-loot svg{width:25px;height:25px;display:block}
.game-loot b{font-size:19px;color:#C8801A}
.game-loot.bump{animation:lootBump .46s cubic-bezier(.3,1.6,.5,1)}
@keyframes lootBump{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}

/* 戳泡泡 */
.g-bubble{background:linear-gradient(180deg,#EAF5FF 0%,#CFE7FA 100%)}
.bub-wrap{position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:6px}
.bubble{position:relative;width:clamp(104px,16vw,168px);height:clamp(104px,16vw,168px);
  border-radius:50%;
  background:radial-gradient(circle at 32% 26%,#FFFFFF 0%,#E4F2FD 36%,#B4D9F5 100%);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:0 8px 18px rgba(40,90,140,.18),inset -6px -8px 14px rgba(120,170,215,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(44px,6.4vw,68px);font-weight:700;color:#153F5E;
  animation:floatY 3.6s ease-in-out infinite}
.bubble::after{content:'';position:absolute;left:20%;top:14%;width:28%;height:21%;
  border-radius:50%;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.98),rgba(255,255,255,0));
  transform:rotate(-30deg)}
@keyframes floatY{0%,100%{transform:translateY(6px)}50%{transform:translateY(-10px)}}
.bubble.hit{animation:pop .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes pop{0%{transform:scale(1);opacity:1}45%{transform:scale(1.22);opacity:.95}
  100%{transform:scale(.25);opacity:0}}
.bubble.miss{animation:shake .4s ease;opacity:.4;filter:grayscale(1);pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
/* 泡泡破了飞出去的水珠 */
.bub-bit{position:absolute;z-index:8;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,rgba(150,205,240,.9));
  pointer-events:none;animation:bubBit .56s ease-out forwards}
@keyframes bubBit{0%{opacity:.95;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.32)}}

/* 钓鱼 */
.g-fish{background:linear-gradient(180deg,#CBE7F8 0%,#93CFEB 40%,#5CABD2 100%)}
.fish-wrap{position:absolute;inset:0;overflow:hidden}
/* 水下光柱 */
.sea-light{position:absolute;top:-40%;left:10%;width:20%;height:170%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:rotate(11deg);filter:blur(5px);pointer-events:none}
.sea-light.b{left:54%;width:13%;transform:rotate(-8deg);opacity:.72}
/* 上浮气泡 */
.sea-bub{position:absolute;bottom:-18px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff,rgba(255,255,255,.3));
  border:1px solid rgba(255,255,255,.6);pointer-events:none;
  animation:bubUp linear infinite}
@keyframes bubUp{0%{transform:translateY(0);opacity:0}
  14%{opacity:.85}100%{transform:translateY(-340px);opacity:0}}
/* 鱼竿：固定在左上，纯装饰，给孩子"在钓鱼"的感觉 */
.rod{position:absolute;left:-6px;top:-6px;width:150px;height:110px;pointer-events:none;z-index:4}
.fish{position:absolute;width:clamp(150px,20vw,212px);height:clamp(90px,12vw,126px);
  display:block;filter:drop-shadow(0 10px 12px rgba(18,68,104,.26));
  animation:swim 3.4s ease-in-out infinite}
.fish-svg{position:absolute;inset:0;width:100%;height:100%}
/* 摆尾与划鳍：原来的游动幅度只有 ±11px / 4.2s，几乎看不出来，
   孩子以为鱼是死的。改成鱼身浮动 + 尾巴摆动一起做。 */
.fish-tail{transform-box:fill-box;transform-origin:100% 50%;animation:tailWag .86s ease-in-out infinite}
@keyframes tailWag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}
.fish-fin{transform-box:fill-box;transform-origin:0 50%;animation:finFlap 1.15s ease-in-out infinite}
@keyframes finFlap{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
/* 字压在鱼身中段偏尾一侧，避开右侧的眼睛与嘴 */
.fish-ch{position:absolute;left:8%;right:20%;top:0;bottom:0;display:flex;
  align-items:center;justify-content:center;font-size:clamp(34px,4.6vw,50px);
  font-weight:700;color:#14384E;text-shadow:0 2px 0 rgba(255,255,255,.55)}
@keyframes swim{0%,100%{transform:translate(-20px,3px) rotate(-2.6deg)}
  50%{transform:translate(20px,-13px) rotate(2.6deg)}}
/* 钓中：鱼被拉出水面，甩尾、变向、缩小收进鱼篓 */
.fish.hit{animation:fishCatch .68s cubic-bezier(.25,.8,.35,1) forwards}
@keyframes fishCatch{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  28%{transform:translate(4px,-30px) rotate(-12deg) scale(1.05)}
  62%{transform:translate(46px,-104px) rotate(12deg) scale(.78)}
  100%{transform:translate(104px,-186px) rotate(-8deg) scale(.22);opacity:0}}
.fish.miss{animation:shake .4s ease;opacity:.35;filter:grayscale(1);pointer-events:none}
/* 水花 */
.catch-splash{position:absolute;z-index:8;width:9px;height:9px;border-radius:50%;
  background:#F2FBFF;box-shadow:0 0 0 2px rgba(255,255,255,.55);pointer-events:none;
  animation:splashGo .58s ease-out forwards}
@keyframes splashGo{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}
.seaweed{position:absolute;bottom:-10px;width:14px;height:70px;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,rgba(120,200,175,.4),rgba(70,150,130,.55));
  transform-origin:bottom center;animation:wave 4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* 鱼篓（战利品容器） */
.fish-basket{position:absolute;right:14px;bottom:8px;width:clamp(62px,7.4vw,86px);
  z-index:3;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(20,60,90,.25))}
.fish-basket.bump{animation:basketBump .46s cubic-bezier(.3,1.6,.5,1)}
@keyframes basketBump{0%,100%{transform:translateY(0) scale(1)}
  45%{transform:translateY(-7px) scale(1.08)}}

/* 摘果子 */
.g-fruit{background:linear-gradient(180deg,#EFF9E6 0%,#D3ECBE 52%,#B4DA94 100%)}
/* 整棵树（树干 + 树冠）在同一张 SVG 里，坐标统一，接缝被叶子盖住 */
.tree-art{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.tree-crown{transform-box:fill-box;transform-origin:50% 92%;pointer-events:none}
.tree-crown.shake{animation:treeShake .52s ease}
@keyframes treeShake{0%,100%{transform:translateX(0) rotate(0)}
  28%{transform:translateX(-7px) rotate(-.8deg)}62%{transform:translateX(6px) rotate(.7deg)}}
/* 草地垫在树后面：树干底部保持实心，不会被渐变冲淡 */
.grass{position:absolute;left:0;right:0;bottom:0;height:15%;z-index:0;
  background:linear-gradient(180deg,rgba(150,205,120,0),#8CC45C);pointer-events:none}
.fruit-wrap{position:absolute;inset:2% 9% 46% 9%;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;z-index:3}
.fruit{position:relative;width:clamp(84px,10.6vw,112px);height:clamp(84px,10.6vw,112px);
  display:flex;align-items:center;justify-content:center;transform-origin:top center;
  animation:swing 3.8s ease-in-out infinite;
  filter:drop-shadow(0 8px 10px rgba(110,70,20,.26))}
.fruit-svg{position:absolute;inset:0;width:100%;height:100%}
.fruit-ch{position:relative;z-index:2;font-size:clamp(34px,4.3vw,46px);font-weight:700;
  color:#4A2606;text-shadow:0 2px 0 rgba(255,255,255,.5)}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
/* 摘下：先被拽一下，再落进右下的篮子 */
.fruit.hit{animation:fruitDrop .66s cubic-bezier(.35,.9,.4,1) forwards}
@keyframes fruitDrop{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  20%{transform:translate(0,-18px) rotate(-12deg) scale(1.06)}
  100%{transform:translate(96px,148px) rotate(30deg) scale(.5);opacity:0}}
.fruit.miss{animation:shake .4s ease;opacity:.35;filter:grayscale(1);pointer-events:none}
/* 篮子 */
.basket{position:absolute;right:5%;bottom:4%;width:clamp(66px,7.8vw,92px);z-index:3;
  pointer-events:none;filter:drop-shadow(0 6px 8px rgba(90,60,20,.22))}
.basket.bump{animation:basketBump .46s cubic-bezier(.3,1.6,.5,1)}

/* 喂小动物 */
.g-feed{background:linear-gradient(180deg,#F2FAE8 0%,#DAEFC9 46%,#BEE0A2 100%)}
.feed-row{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;gap:26px;padding:12px 20px}
.feed-animal{position:relative;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;gap:6px;background:rgba(255,255,255,.58);
  border:2px solid rgba(255,255,255,.92);border-radius:26px;padding:12px 16px 10px;
  box-shadow:0 12px 24px rgba(80,110,60,.16),inset 0 2px 0 rgba(255,255,255,.9)}
.feed-animal::after{content:'';position:absolute;left:12%;right:12%;bottom:-9px;height:14px;
  border-radius:50%;background:rgba(90,120,60,.16);filter:blur(4px);z-index:-1}
.feed-animal svg{width:clamp(128px,17vw,180px);height:clamp(128px,17vw,180px);
  filter:drop-shadow(0 6px 6px rgba(90,70,40,.16))}
.feed-say{background:#fff;border:2px solid var(--line2);border-radius:14px;
  padding:7px 14px;font-size:15px;font-weight:800;color:var(--ink2);
  max-width:100%;text-align:center;position:relative;white-space:nowrap;
  box-shadow:0 4px 10px rgba(80,110,60,.1)}
.feed-say::after{content:'';position:absolute;top:-10px;left:50%;margin-left:-9px;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:10px solid #fff}
.feed-plates{flex:0 1 430px;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:12px;place-items:center;min-width:0}
/* 食盆：上宽下收的碗，碗沿有厚度。字必须压得住伪元素，否则会被碗盖住看不见 */
.plate{position:relative;width:clamp(96px,11.8vw,130px);height:clamp(88px,10.6vw,116px);
  display:flex;align-items:flex-start;justify-content:center;padding-top:16px;
  font-size:clamp(32px,4.1vw,44px);font-weight:700;color:#57360F}
.plate-ch{position:relative;z-index:3;line-height:1;
  text-shadow:0 2px 0 rgba(255,255,255,.9)}
.plate::before{content:'';position:absolute;left:0;right:0;bottom:0;height:52%;
  border-radius:0 0 44% 44% / 0 0 82% 82%;
  background:linear-gradient(180deg,#FFFDF6 0%,#F0E3CA 56%,#DCC7A4 100%);
  border:2px solid #D6C3A0;border-top:none;
  box-shadow:inset 0 7px 12px rgba(255,255,255,.95),0 9px 16px rgba(120,95,55,.22)}
.plate::after{content:'';position:absolute;left:4%;right:4%;bottom:47%;height:11px;
  border-radius:50%;background:linear-gradient(180deg,#FFFCF3,#F3E8D2);
  border:2px solid #DDCBA9}
.plate.hit{animation:feedGo .52s ease-in forwards}
@keyframes feedGo{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(.95);opacity:.28}}
.plate.miss{animation:shake .4s ease;opacity:.35;filter:grayscale(1);pointer-events:none}
.feed-animal.happy svg{animation:chew .55s ease-in-out 2}
@keyframes chew{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.07) rotate(-3deg)}}
.feed-heart{position:absolute;top:28%;left:50%;z-index:9;width:23px;height:23px;
  pointer-events:none;animation:heartUp .95s ease-out forwards}
@keyframes heartUp{0%{opacity:0;transform:translate(-50%,0) scale(.55)}
  24%{opacity:1;transform:translate(-50%,-18px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-66px) scale(.9)}}

/* 提示光圈 */
.glow{animation:glowPulse 1s ease-in-out 2;position:relative;z-index:2}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,79,.55)}
  50%{box-shadow:0 0 0 14px rgba(47,107,79,0)}}

/* 游戏结束 */
.game-over{position:absolute;inset:0;z-index:8;background:rgba(255,253,247,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:20px;text-align:center}
.go-title{font-size:30px;font-weight:800}
.go-stars{font-size:46px;letter-spacing:8px;color:var(--amber);line-height:1.1}
.go-sub{font-size:18px;color:var(--ink2);font-weight:700}
.go-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.go-btns button{min-height:52px;padding:11px 24px;font-size:18px}

/* ---------- 首屏加载提示 ---------- */
.boot-mask{position:fixed;inset:0;z-index:99;background:#FBF8EF;
  display:flex;align-items:center;justify-content:center;
  animation:bootFade .45s ease 2.4s forwards}
@keyframes bootFade{to{opacity:0;visibility:hidden}}
.bm-card{display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:15px;color:var(--ink3);font-weight:700}
.bm-card b{font-size:22px;color:var(--ink);letter-spacing:1px}
.bm-dot{width:34px;height:34px;border-radius:50%;
  border:3px solid #DBE7D5;border-top-color:#2F6B4F;animation:bmSpin .9s linear infinite}
@keyframes bmSpin{to{transform:rotate(360deg)}}

/* ---------- 声音设置面板 ---------- */
.av-mask{position:fixed;inset:0;z-index:80;background:rgba(27,36,44,.45);
  display:flex;align-items:center;justify-content:center;padding:18px}
.av-panel{width:min(460px,100%);max-height:92vh;overflow-y:auto;
  background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:16px 20px 18px;box-shadow:0 22px 60px rgba(20,30,40,.28)}
.av-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.av-head b{font-size:20px}
.av-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-top:1.5px solid var(--line);margin-top:12px}
.av-name{flex:1;min-width:0;font-size:16px;font-weight:800;color:var(--ink);line-height:1.35}
.av-name em{display:block;font-style:normal;font-size:13px;font-weight:600;
  color:var(--ink3);margin-top:4px;line-height:1.4}
.av-sw{min-width:74px;min-height:46px;border-radius:999px;border:2px solid var(--line2);
  background:#F0EADC;color:var(--ink3);font-size:16px;font-weight:800;padding:0 12px;flex:0 0 auto}
.av-sw.on{border-color:var(--green-line);background:var(--green-bg);color:var(--green)}
.av-sw:active{transform:scale(.96)}
.av-seg{display:flex;border:2px solid var(--line2);border-radius:12px;
  overflow:hidden;flex:0 0 auto}
.av-seg button{border:0;background:var(--card);padding:0 15px;min-height:44px;
  font-size:15px;font-weight:800;color:var(--ink3)}
.av-seg button.on{background:var(--blue);color:#fff}
.av-try{width:100%;margin-top:16px;min-height:48px;font-size:16px}
.av-tip{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--ink3)}

/* ---------- 窄屏降级（共用电脑也可能接小屏，必须能单列） ---------- */

@media (max-width:640px){
  .screen{padding:14px 12px 22px}
  /* 我的主页窄屏：头像和圆环都要收，不然一行塞不下会挤成两行 */
  .home-hero{gap:14px;padding:16px}
  .home-hero .ring-wrap,.home-hero .ring{width:96px;height:96px}
  .home-hero .ring-txt b{font-size:24px}
  .home-av{width:54px;height:54px;font-size:22px}
  .home-nm h2{font-size:21px}
  .home-stats{gap:8px}
  .home-stats .hs{padding:10px}
  .home-stats .hs b{font-size:22px}
  .home-go{min-height:62px;font-size:20px}
  .pre-foot .pre-back{width:100%;margin-left:0}
  .opts,.opts.four{grid-template-columns:1fr}
  .stu-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
  /* 今日字卡窄屏：两列、字略小，开始按钮整行（单手好按） */
  .pre-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pre-card{min-height:152px;padding:24px 8px 18px}
  .pre-char{font-size:62px}
  .pre-wd{font-size:18px}
  .pre-foot{gap:10px}
  .pre-go{width:100%;margin-left:0;min-height:58px;font-size:20px}
  .mx-row{grid-template-columns:88px repeat(2,minmax(58px,1fr))}
  /* 进度头图窄屏：圆环居中，四段数字改两列，别挤成一团 */
  .prog-hero{grid-template-columns:1fr;gap:16px;justify-items:center;padding:18px 16px}
  .hero-main{width:100%}
  .stack-legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .ring-wrap,.ring{width:116px;height:116px}
  .ring-txt b{font-size:29px}
  /* 进度行窄屏：姓名+百分比一行，进度条独占一行，按钮整行 */
  .prow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px}
  .prow-name{grid-column:1;grid-row:1;min-width:0}
  .prow-rate{grid-column:2;grid-row:1;text-align:right}
  .prow .prog-mini{grid-column:1 / -1;grid-row:2;width:100%}
  .prow-none{grid-column:1 / -1;grid-row:2}
  .prow .prow-btn{grid-column:1 / -1;grid-row:3;width:100%}
  .prof-stats{grid-template-columns:repeat(2,1fr)}
  /* 窄屏：头像姓名独占一行，两个按钮平分第二行，别把「编辑资料与字表」压成小字 */
  .prof-who{flex:1 1 100%;order:-1}
  .prof-top .ghost-btn,.prof-top .secondary{flex:1 1 40%;min-height:44px;padding:9px 10px;font-size:14px}
  .prof-top{gap:8px}
  .prof-grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
  .pgc{min-height:52px;font-size:24px}
  .prof-acts button{flex:1 1 100%}
  .big-char{font-size:104px}
  .opt{min-height:104px;font-size:52px}
  /* 词库表窄屏：先砍掉「释义/例句」「图示」两列，剩下的 5 列刚好塞下，不至于横滚到看不见按钮 */
  #tpWord table.grid th:nth-child(4),#tpWord table.grid td:nth-child(4),
  #tpWord table.grid th:nth-child(5),#tpWord table.grid td:nth-child(5){display:none}
  #tpWord table.grid{min-width:0}
  #tpWord table.grid th,#tpWord table.grid td{padding:8px 7px;white-space:nowrap}
  #tpWord .sp-builtin{white-space:nowrap}
  /* 拼词语：字块缩到 78px，六个正好两行三列，仍远大于 44px 的点击下限 */
  .wb-tiles{display:grid;grid-template-columns:repeat(3,78px);gap:10px;
    justify-content:center;margin:2px 0}
  .wb-tile{width:78px;height:78px;font-size:44px;border-radius:16px}
  .wb-tile.sel{transform:translateY(-3px);box-shadow:0 6px 0 #CFE0F2}
  .wb-slot{padding:5px;gap:4px}
  .wb-slot em{width:34px;height:34px;border-radius:8px}
  .wb-slot.on{font-size:27px;padding:0 12px;min-height:48px;letter-spacing:3px}
  .wb-tip{font-size:15px;margin-top:12px}
  .pick-top h1{font-size:23px}
  .help-bar{gap:8px}
  .help-btn{padding:9px 12px;font-size:15px}
  .nav-in{padding:8px 12px}
  .nav-logo{display:none}
  .nav-btn{padding:8px 18px;font-size:16px}
  .learn-hero h1{font-size:25px}
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
  .ch-card{min-height:104px;padding:10px 4px 8px}
  .ch-big{font-size:38px}
  .sheet-body{gap:12px}
  .sheet-left{width:96px}
  .sheet-art,.sheet-art img{width:96px;height:96px}
  .sheet-char{font-size:64px}
  .sheet-py{font-size:20px}
  .sg-grid{grid-template-columns:1fr}
  .feed-row{flex-direction:column;gap:6px;padding:10px}
  .feed-animal{flex-direction:row;gap:10px;padding:6px 12px;border-radius:18px}
  .feed-animal svg{width:84px;height:84px}
  .feed-say{font-size:13px;padding:5px 10px;white-space:normal}
  .feed-say::after{display:none}
  .feed-plates{flex:1 1 auto;width:100%}
  .plate{width:72px;height:72px;font-size:32px}
  .game-field{min-height:340px}
  .game-ask{padding:8px 12px;gap:10px}
  .game-spk{height:50px;padding:0 13px;font-size:15px}
  .ga-word b{font-size:36px}
}
</style>
