function play(k){
  if (cur){ try{cur.pause();}catch(e){} }
  if (curRow) curRow.classList.remove('on');
  var r = document.querySelector('.row[data-k="'+k+'"]');

document.getElementById('seq').addEventListener('click', function(){

  function next(){

    var k = ks[i++];

    cur.onended = function(){
