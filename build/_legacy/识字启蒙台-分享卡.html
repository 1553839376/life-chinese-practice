<title>识字启蒙台 · 扫码使用</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 28px 16px 48px;
    background: #F7F3E8;
    color: #23303B;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  .card {
    width: 100%; max-width: 520px;
    background: #FFFDF7;
    border: 2px solid #E6DCC6;
    border-radius: 24px;
    padding: 32px 28px 28px;
    box-shadow: 0 10px 30px rgba(80, 64, 32, .10);
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    background: #FFF1D0; color: #8A6A18;
    border-radius: 999px; padding: 6px 16px;
    font-size: 15px; font-weight: 700; letter-spacing: .04em;
  }
  h1 {
    margin: 16px 0 6px;
    font-size: 40px; line-height: 1.2; letter-spacing: .04em;
    font-weight: 800; color: #1B242C;
  }
  .sub { margin: 0 0 22px; font-size: 17px; line-height: 1.7; color: #5C6B77; }
  .qr-wrap {
    display: inline-block;
    background: #FFFFFF;
    border: 2px solid #E6DCC6;
    border-radius: 20px;
    padding: 16px;
    line-height: 0;
  }
  .qr-wrap img { width: 232px; height: 232px; display: block; }
  .tip { margin: 16px 0 0; font-size: 16px; font-weight: 700; color: #2F6B4F; }
  .link {
    margin: 14px 0 0; padding: 12px 14px;
    background: #F2F6FA; border: 1px dashed #C3D2DE; border-radius: 12px;
    font-size: 14px; line-height: 1.6; color: #3A4A57;
    word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  ol { margin: 24px 0 0; padding: 0 0 0 2px; text-align: left; list-style: none; counter-reset: s; }
  ol li {
    counter-increment: s;
    position: relative;
    padding: 0 0 14px 40px;
    font-size: 16.5px; line-height: 1.65; color: #364652;
  }
  ol li::before {
    content: counter(s);
    position: absolute; left: 0; top: 1px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #2F6B4F; color: #fff;
    font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  ol li:last-child { padding-bottom: 0; }
  .foot {
    margin: 26px auto 0; padding-top: 18px;
    border-top: 1px solid #EAE2D0;
    font-size: 13.5px; line-height: 1.7; color: #8A8578;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; border-color: #D8D0BC; }
    @page { size: A5; margin: 10mm; }
  }
</style>
